name: Python package
on:
  push:
  pull_request:
    branches: [ dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Install tools
        run: 
          [pipx install ruff
          pipx install vulture]
      - name: Run Linter
        run: 
          ruff check --output-format=github --target-version=py39
          ruff format --diff --target-version=py39
        continue-on-error: true
      - name: Run vulture
        run: vulture . --min-confidence 80
      - name: Run tests
        run: pytest


